version: '3.8'

services:
  nlp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nlp
    container_name: travel-nlp-service
    volumes:
      - ../:/app
      - nlp-models:/app/models
      - nlp-data:/app/data
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-travel_password}
    depends_on:
      - neo4j
    networks:
      - travel-network
    stdin_open: true
    tty: true
    command: /bin/bash

  # ==============================
  # Neo4j - Graph Database for Train Routes
  # ==============================
  neo4j:
    image: neo4j:5.14-community
    container_name: travel-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-travel_password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - travel-network

  # ==============================
  # Jupyter Lab 
  # ==============================
  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nlp
    container_name: travel-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ../:/app
      - nlp-models:/app/models
      - nlp-data:/app/data
    environment:
      - PYTHONPATH=/app
      - JUPYTER_ENABLE_LAB=yes
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-travel_password}
    depends_on:
      - neo4j
    networks:
      - travel-network
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''

  # ==============================
  # MLflow - Experiment Tracking 
  # ==============================
  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nlp
    container_name: travel-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    networks:
      - travel-network
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

networks:
  travel-network:
    driver: bridge

volumes:
  nlp-models:
  nlp-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  mlflow-data:
